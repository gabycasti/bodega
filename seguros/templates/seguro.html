{% extends 'base.html' %}

{% block content %}
<style>
  thead, th {
        background-color: transparent !important;
    }

 .btn-orange, 
 .btn-orange:hover, 
 .btn-orange:focus, 
 .btn-orange:active {
    background-color: #f39c12 !important;
    border-color: #e08e0b !important;
    color: #fff !important;
}

 .link-sin-color {
      color: inherit !important;
      text-decoration: none !important;
  }


table.dataTable {
    border-top: 2px solid #dee2e6;
}

.dataTables_wrapper .dataTables_filter {
    margin-bottom: 15px;
}


</style>
<div class="main-container " style="border-style: solid;border-width: 0px 1px 1px 1px; border-color: blue;">
     <div class="row  ms-3 me-3">
          <section class="content-header" style="display: flex; justify-content: space-between; align-items: center;">
               <h3 style="margin: 10px;"><i class="fa fa-user icon-title"></i> Agregar  Seguro</h3>
               <ol class="breadcrumb" style="margin: 0; padding: 0; display: flex; align-items: center;">
                 <br>
                 <li style="margin-right: 5px;"><a href="{% url 'dashboard' %}" class=" me-2 link-sin-color"><i class="fa fa-home"></i> Inicio ></a></li>
                 <li style="margin-right: 5px;"><a href="{% url 'seguro_listado' %}" class="link-sin-color">Listado Seguro</a></li>
               </ol>
          </section>
          
          <hr style="border: 2px solid #3c8dbc;">
        
<div class="col-8">
    <form action="" method="post" enctype="multipart/form-data" class="form-control border-0">

        {% csrf_token %}

        <!-- Vehículo -->
        <div class="row mb-3">
            <div class="col-md-4 text-end">
                <label for="vehiculo" class="form-label">Vehículo</label>
            </div>

            <div class="col-md-8">
                <select name="vehiculo" id="vehiculo" class="form-select" required>
                    <option value="">Seleccione un vehículo</option>

                    {% for v in vehiculos %}
                        <option value="{{ v.id }}">
                            {{ v.patente }} - {{ v.marca }} {{ v.modelo }}
                        </option>
                    {% endfor %}

                </select>
            </div>
        </div>


        <!-- Banco -->
        <div class="row mb-3">
            <div class="col-md-4 text-end">
                <label for="banco" class="form-label">Banco</label>
            </div>

            <div class="col-md-8">
                <select name="banco" id="banco" class="form-select" required>
                    <option value="">Seleccione un banco</option>
                    <option value="BCI">Banco BCI</option>
                </select>
            </div>
        </div>


        <!-- Número de póliza -->
        <div class="row mb-3">
            <div class="col-md-4 text-end">
                <label for="numero_poliza" class="form-label">
                    Número de póliza
                </label>
            </div>

            <div class="col-md-8">
                <input type="text"
                       name="numero_poliza"
                       id="numero_poliza"
                       class="form-control"
                       maxlength="100"
                       required>
            </div>
        </div>


        <!-- Item -->
            <div class="row mb-3">
                <div class="col-md-4 text-end">
                    <label for="item" class="form-label">Item</label>
                </div>

                <div class="col-md-8">
                    <input type="text"
                        name="item"
                        id="item"
                        class="form-control"
                        maxlength="100">
                </div>
            </div>


        <!-- Fecha vencimiento -->
        <div class="row mb-3">
            <div class="col-md-4 text-end">
                <label for="fecha_vencimiento" class="form-label">
                    Fecha vencimiento
                </label>
            </div>

            <div class="col-md-8">
                <input type="date"
                       name="fecha_vencimiento"
                       id="fecha_vencimiento"
                       class="form-control"
                       required>
            </div>
        </div>


        <!-- Archivo -->
        <div class="row mb-3">
            <div class="col-md-4 text-end">
                <label for="archivo" class="form-label">
                    Archivo
                </label>
            </div>

            <div class="col-md-8">
                <input type="file"
                       name="archivo"
                       id="archivo"
                       class="form-control"
                       accept=".pdf">
            </div>
        </div>


        <!-- Botón -->
        <div class="row mb-3">
            <div class="col-md-4 text-end"></div>

            <div class="col-md-4 d-flex justify-content-center gap-2">

                <button type="submit" class="btn btn-primary btn-sm">
                    Guardar
                </button>

                <button type="button"
                        class="btn btn-secondary btn-sm"
                        onclick="window.location.href='{% url 'seguro_listado' %}'">
                    Cancelar
                </button>

            </div>
        </div>

        <hr>
        <br>

    </form>
</div>


     </div>
</div>

{% endblock %}

{% block scripts %}



<script>

  document.addEventListener("DOMContentLoaded", function () {

    const empleado = document.getElementById("empleado_id");
    const rut = document.getElementById("rut");

    empleado.addEventListener("change", function () {

        const opcion = this.options[this.selectedIndex];

        rut.value = opcion.dataset.rut || "";

    });

  
});

  
</script>

{% endblock %}
